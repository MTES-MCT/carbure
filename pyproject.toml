[project]
name = "carbure"
version = "3.5.0"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.118",
    "beautifulsoup4==4.15.0",
    "coverage==7.17.0",
    "dictdiffer==0.10.0",
    # Stay on the security-supported LTS series compatible with MySQL 8.0.
    "django==5.2.18",
    "django-admin-list-filter-dropdown==1.0.3",
    "django-authtools==2.1.0",
    "django-csp==4.0",
    "django-environ==0.14.0",
    "django-otp==1.7.5",
    "django-silk==5.6.0",
    "django-storages==1.14.6",
    "djangorestframework==3.18.3",
    "factory-boy==3.3.3",
    "folium==0.20.0",
    "gunicorn==26.2.0",
    "huey==3.5.3",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
    "mysqlclient==2.3.0",
    "openpyxl==3.1.5",
    "pandas==3.1.0",
    "pyjwt==2.15.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.5",
    "redis==8.1.0",
    "requests==2.34.2",
    "sentry-sdk==2.73.0",
    "tqdm==4.70.1",
    "tzdata==2026.5",
    "whitenoise==6.12.0",
    "xlsxwriter==3.3.0",
    "python-docx",
    "django-filter",
    "drf-spectacular",
    "drf-nested-routers",
    "setuptools==84.2.1",
    "psutil",
    "scipy",
    "django-simple-history",
    "scikit-learn",
    "sqlalchemy",
    "urllib3==2.8.0",
    "djangorestframework-api-key==3.*",
    "djangorestframework-simplejwt==5.*",
    "django-import-export",
    "django-cte>=4.0.0",
]

[tool.ruff]
src = ["web"]
exclude = ["__init__.py", "scripts", ".venv"]
line-length = 125

[dependency-groups]
dev = [
    "django-stubs",
    "types-python-dateutil",
    "types-pytz",
    "types-requests",
    "pandas-stubs",
    "openpyxl-stubs",
    "types-factory-boy",
    "types-pyjwt",
    "djangorestframework-stubs[compatible-mypy]",
    "types-six",
    "pre-commit",
    "ruff==0.8.6",
    "pip-audit",
    "ipython",
]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # Pycodestyle Error
    "W",    # Pycodestyle Error
    "I",    # isort
    "C4",   # comprehension list
    "ICN",  # Import convention
    "PYI",  # Type Hinting
    "T20",  # No direct printing
    "B018", # useless expression
    "B011", # assert false
    "B006", # Mutable argument default
    "B007", # unused loop variable
    "INP",  # No PEP420
]
ignore = [
    "T201", # Print
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
